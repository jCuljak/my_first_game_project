<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My First Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="game-shell">
    <div id="canvas-wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <button id="pause-btn" type="button" aria-label="Pause">II</button>
    </div>

    <p id="hint">
      Move WASD / Arrows &middot; Shift Dash &middot; Esc Pause &middot; R Restart &middot; M Mute
    </p>
    <p id="hint-touch">Drag to move &middot; Tap DASH &middot; Tap II to pause</p>

    <div id="touch-controls">
      <div id="joystick" aria-hidden="true">
        <div id="joystick-knob"></div>
      </div>
      <button id="dash-btn" type="button">DASH</button>
    </div>
  </main>

  <!-- audio.js first: game.js reads GameAudio on its very first frame. -->
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
